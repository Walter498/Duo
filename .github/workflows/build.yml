name: Build DuoStatusBar (arm64e)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Makefile'
      - 'control'
      - 'duostatusprefs/**'
      - 'DuoStatusBar.plist'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install ldid dpkg
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build tweak package (arm64e)
        run: |
          export THEOS="$HOME/theos"
          set -o pipefail
          make package FINALPACKAGE=1 TARGET=iphone:clang:latest:14.0 2>&1 | tee /tmp/build.log

      - name: Show build log on failure
        if: failure()
        run: |
          echo "===== BUILD LOG TAIL ====="
          tail -150 /tmp/build.log || true
          echo "===== THEOS VERSION ====="
          ls "$HOME/theos/sdks" || true

      - name: Inspect arch (must be arm64e)
        if: success()
        run: find .theos/obj -name '*.dylib' -exec file {} \;

      - name: Commit deb back to repo
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/*.deb
          git commit -m "CI: build arm64e deb [skip ci]" || echo "nothing new"
          git push

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DuoStatusBar-arm64e
          path: packages/*.deb
